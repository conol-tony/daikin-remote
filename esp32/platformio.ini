; Daikin ARC466A41 remote emulator, ESP32 variant for LilyGo T-Display boards.
; (The primary target in this repo is the T-Display-SF32; this build is for
; the ESP32 / ESP32-S3 T-Display family.)
;   pio run -e tdisplay    -t upload   ; original LilyGo/TTGO T-Display (ESP32, 1.14" 135x240)
;   pio run -e tdisplay_s3 -t upload   ; LilyGo T-Display-S3 (ESP32-S3, 1.9" 170x320)
; Override the IR LED pin with e.g.  -D PIN_IR_LED=13  in build_flags.

[platformio]
default_envs = tdisplay

[env]
; 6.5.0 = Arduino core 2.0.14, the last core TFT_eSPI is reliable on for the
; T-Display-S3 (LilyGo README, TFT_eSPI issue #3329).
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    symlink://../protocol
build_flags =
    -D USER_SETUP_LOADED=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1

; ---------------------------------------------------------------------------
; Original T-Display (ESP32). Display defines mirror TFT_eSPI's
; User_Setups/Setup25_TTGO_T_Display.h.
[env:tdisplay]
board = lilygo-t-display
build_flags =
    ${env.build_flags}
    -D BOARD_TDISPLAY=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MISO=-1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000

; ---------------------------------------------------------------------------
; T-Display-S3 (ESP32-S3). Display defines mirror TFT_eSPI's
; User_Setups/Setup206_LilyGo_T_Display_S3.h.
[env:tdisplay_s3]
board = lilygo-t-display-s3
build_flags =
    ${env.build_flags}
    -D BOARD_TDISPLAY_S3=1
    -D ST7789_DRIVER=1
    -D INIT_SEQUENCE_3=1
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON=1
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=5
    -D TFT_WR=8
    -D TFT_RD=9
    -D TFT_D0=39
    -D TFT_D1=40
    -D TFT_D2=41
    -D TFT_D3=42
    -D TFT_D4=45
    -D TFT_D5=46
    -D TFT_D6=47
    -D TFT_D7=48
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=HIGH
