# Daikin ARC466A41 remote emulator for LilyGo T-Display-SF32.
# Board defaults (customer/boards/t-display-sf32/hcpu/board.conf) already
# enable UART1 console, PWM3 (GPTIM2, IR carrier on PA36), the on-chip RTC,
# the CO5300 AMOLED and the touch controller.
# CONFIG_LCD_USING_TFT_CO5300 is not set
CONFIG_LCD_USING_TFT_CO5300_T_SF32=y
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_RT_MAIN_THREAD_PRIORITY=15
CONFIG_RT_SERIAL_RB_BUFSZ=256
CONFIG_RT_USING_ULOG=y
# CONFIG_ULOG_USING_COLOR is not set
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_USING_BUTTON_LIB=y
CONFIG_BUTTON_MAX_NUM=3
# XL9555 I/O expander on the keyboard board switches the IR LED's 3V3 rail.
CONFIG_PKG_USING_XL9555=y
# TCA8418 scans the keyboard shield's 20-key matrix on I2C1 / PA11 IRQ.
# The SDK device delivers press events; the application forwards them to UI.
CONFIG_PKG_USING_PKG_KEY_BOARD=y
CONFIG_TCA8418_USING_RT_DEVICE=y
CONFIG_RT_USING_DFS_ELMFAT=y
CONFIG_PKG_USING_LITTLEVGL2RTT=y
CONFIG_LVGL_V9=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_30=y
CONFIG_LV_FONT_MONTSERRAT_36=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_DEF_REFR_PERIOD=15
# SGM41562B charger. Without a host driver it stays in its power-on default
# mode: battery charging disabled (CEB=1), and a 40 s I2C watchdog (forced on
# whenever USB power appears) power-cycles the board. The IR LED's WIFI_3V3
# regulator runs from the battery, so it must be charged. Opening the device
# (ir_power.c) applies LilyGo's defaults: charging on, watchdog off.
CONFIG_PKG_USING_SGM41562B=y
CONFIG_SGM41562B_USING_RT_DEVICE=y
# Register GPADC1 as the RT-Thread ADC device "bat1" (channel 7 = battery),
# which ir_power.c reads before every send. board.conf only sets
# CONFIG_BSP_USING_ADC; without ADC1 drv_adc.c registers no ADC device at all.
CONFIG_BSP_USING_ADC1=y
# Button "hold" actions after 0.8 s instead of the library default of 3 s.
CONFIG_BUTTON_ADV_ACTION_CHECK_DELAY=800
# Let "ac sendraw <70 hex digits>" fit on one shell line (default 80 / 10).
CONFIG_FINSH_CMD_SIZE=256
CONFIG_FINSH_ARG_MAX=40
